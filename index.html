<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: Space Grotesk for numerals, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-shell">

    <!-- ── Theme toggle ──────────────────────────────── -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle theme">
      <span class="icon-dark">☀️</span>
      <span class="icon-light">🌙</span>
    </button>

    <!-- ── Calculator card ───────────────────────────── -->
    <div class="calculator" role="application" aria-label="Calculator">

      <!-- Display -->
      <div class="display" aria-live="polite">
        <div class="display__history" id="history" aria-label="Calculation history"></div>
        <div class="display__expression" id="expression" aria-label="Current expression"></div>
        <div class="display__result" id="result" aria-label="Result">0</div>
      </div>

      <!-- History panel (bonus) -->
      <div class="history-panel" id="historyPanel" aria-hidden="true">
        <div class="history-panel__header">
          <span>History</span>
          <button class="history-clear-btn" id="clearHistory" aria-label="Clear history">Clear all</button>
        </div>
        <ul class="history-list" id="historyList" aria-label="Past calculations"></ul>
        <p class="history-empty" id="historyEmpty">No calculations yet.</p>
      </div>

      <!-- Button grid -->
      <div class="btn-grid" role="group" aria-label="Calculator buttons">

        <!-- Row 1: utilities -->
        <button class="btn btn--util btn--wide" data-action="clear"    aria-label="Clear">C</button>
        <button class="btn btn--util"            data-action="delete"   aria-label="Delete last character">⌫</button>
        <button class="btn btn--util"            data-action="history"  aria-label="Toggle history" id="historyToggle">🕘</button>
        <button class="btn btn--op"              data-action="operator" data-value="/" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="btn btn--num" data-action="number" data-value="7" aria-label="7">7</button>
        <button class="btn btn--num" data-action="number" data-value="8" aria-label="8">8</button>
        <button class="btn btn--num" data-action="number" data-value="9" aria-label="9">9</button>
        <button class="btn btn--op"  data-action="operator" data-value="*" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="btn btn--num" data-action="number" data-value="4" aria-label="4">4</button>
        <button class="btn btn--num" data-action="number" data-value="5" aria-label="5">5</button>
        <button class="btn btn--num" data-action="number" data-value="6" aria-label="6">6</button>
        <button class="btn btn--op"  data-action="operator" data-value="-" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="btn btn--num" data-action="number" data-value="1" aria-label="1">1</button>
        <button class="btn btn--num" data-action="number" data-value="2" aria-label="2">2</button>
        <button class="btn btn--num" data-action="number" data-value="3" aria-label="3">3</button>
        <button class="btn btn--op"  data-action="operator" data-value="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="btn btn--num btn--zero" data-action="number" data-value="0" aria-label="0">0</button>
        <button class="btn btn--num" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="btn btn--eq"  data-action="equals"  aria-label="Equals">=</button>

      </div>

      <!-- Scientific row (bonus) -->
      <div class="sci-row" id="sciRow">
        <button class="btn btn--sci" data-action="sci" data-value="sqrt"  aria-label="Square root">√</button>
        <button class="btn btn--sci" data-action="sci" data-value="square" aria-label="Square">x²</button>
        <button class="btn btn--sci" data-action="sci" data-value="sin"   aria-label="Sine">sin</button>
        <button class="btn btn--sci" data-action="sci" data-value="cos"   aria-label="Cosine">cos</button>
        <button class="btn btn--sci" data-action="sci" data-value="tan"   aria-label="Tangent">tan</button>
        <button class="btn btn--sci" data-action="sci" data-value="log"   aria-label="Logarithm">log</button>
        <button class="btn btn--sci" data-action="sci" data-value="ln"    aria-label="Natural log">ln</button>
        <button class="btn btn--sci" data-action="sci" data-value="pi"    aria-label="Pi">π</button>
      </div>

      <!-- Footer: sci toggle -->
      <div class="calc-footer">
        <button class="sci-toggle" id="sciToggle" aria-label="Toggle scientific functions">
          Scientific <span id="sciArrow">▾</span>
        </button>
        <span class="kbd-hint" aria-hidden="true">Keyboard supported</span>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
